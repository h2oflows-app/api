services:
  postgres:
    build: ./infra/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-h2oflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-h2oflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-h2oflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:      postgres://${POSTGRES_USER:-h2oflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-h2oflow}?sslmode=disable
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY:     ${VOYAGE_API_KEY}
      SUPABASE_JWKS_URL:  ${SUPABASE_JWKS_URL}
      USGS_API_KEY:       ${USGS_API_KEY}
      DWR_API_KEY:        ${DWR_API_KEY}
      # Invite sync (api#169-178). These have been live on prod since 2026-08-01
      # but only ever as a hand edit on the EC2 host — restoring this file from
      # git would have silently un-configured email on the next recreate:
      # RESEND_API_KEY unset falls back to NoopMailer (internal/mail), so invites
      # log instead of send, and RSVP_INBOUND_SECRET unset makes the inbound RSVP
      # handler return 503.
      #
      # Listed explicitly rather than via env_file, matching DWR_API_KEY above —
      # this service deliberately enumerates what it passes through. (Staging is
      # the opposite: docker-compose.staging.yml uses `env_file: .env.staging`,
      # which is why it never needed these lines.)
      MAIL_FROM:          ${MAIL_FROM}
      RESEND_API_KEY:     ${RESEND_API_KEY}
      RSVP_INBOUND_SECRET: ${RSVP_INBOUND_SECRET}
      WEB_BASE_URL:       ${WEB_BASE_URL:-https://h2oflows.app}
      APP_PORT:          "8080"
      APP_DOMAIN:        h2oflows.app
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - default
      - edge

networks:
  # Shared with the staging stack so this Caddy can reach api-stg. Created by ec2-staging-setup.sh.
  edge:
    external: true
    name: h2oedge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
