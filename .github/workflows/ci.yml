name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Throwaway Postgres, created and destroyed with the job. It is NOT the dev
    # or staging database and holds no data — the schema is built purely from
    # migrations/, which is the point: a long-lived database drifts (hand-run
    # SQL, an abandoned branch's migration left applied), so it can silently
    # disagree with what migrations/ actually produces. A from-scratch build
    # cannot drift.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: h2oflows
          POSTGRES_PASSWORD: h2oflows
          POSTGRES_DB: h2oflows
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://h2oflows:h2oflows@localhost:5432/h2oflows?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Apply migrations
        run: |
          go install github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path migrations -database "pgx5://h2oflows:h2oflows@localhost:5432/h2oflows?sslmode=disable" up

      # Go does not typecheck embedded SQL, so a query naming a column that a
      # migration dropped builds, vets and tests clean, then fails only when a
      # real request runs it. That is how /api/v1/gauges/search and
      # /api/v1/gauges/batch returned 500 in production for weeks (api#189),
      # and how POST /trips and GET /og/reports/{id} broke unnoticed.
      #
      # sqlcheck PREPAREs every embedded statement against the schema built
      # above. PREPARE resolves all table and column references without
      # executing anything, so drift fails here instead of in production.
      - name: SQL schema check
        run: go run ./cmd/sqlcheck
