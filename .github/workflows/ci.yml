name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://h2oflows:h2oflows@localhost:5432/h2oflows?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Built from infra/postgres/Dockerfile — the SAME image definition dev and
      # prod use, so extension availability (postgis + pgvector) can't drift
      # between what CI validates and what actually runs. A stock postgis image
      # lacks pgvector and would fail at mig 000028.
      #
      # Built and run explicitly rather than declared under `services:`, which
      # can only pull a pre-built image.
      #
      # This container is created and destroyed with the job. It is NOT the dev
      # or staging database and holds no data — the schema comes only from
      # migrations/. That is the point: a long-lived database drifts (hand-run
      # SQL, an abandoned branch's migration left applied) and can silently
      # disagree with what migrations/ produces. A from-scratch build cannot.
      - name: Start Postgres
        run: |
          docker build -t h2oflows-postgres-ci infra/postgres
          docker run -d --name postgres-ci \
            -e POSTGRES_USER=h2oflows \
            -e POSTGRES_PASSWORD=h2oflows \
            -e POSTGRES_DB=h2oflows \
            -p 5432:5432 \
            h2oflows-postgres-ci
          for i in $(seq 1 60); do
            docker exec postgres-ci pg_isready -U h2oflows -d h2oflows && exit 0
            sleep 2
          done
          echo "postgres did not become ready"; docker logs postgres-ci; exit 1

      # Go does not typecheck embedded SQL, so a query naming a column that a
      # migration dropped builds, vets and tests clean, then fails only when a
      # real request runs it. That is how /api/v1/gauges/search and
      # /api/v1/gauges/batch returned 500 in production for weeks (api#189),
      # and how POST /trips and GET /og/reports/{id} broke unnoticed.
      #
      # sqlcheck applies migrations/ and then PREPAREs every embedded statement
      # against the result. PREPARE resolves all table and column references
      # without executing anything, so drift fails here instead of in production.
      - name: SQL schema check
        run: go run ./cmd/sqlcheck -migrations migrations
