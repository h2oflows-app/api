name: deploy-staging

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]
  workflow_dispatch:
    inputs:
      action:
        description: start or stop the staging stack
        required: true
        default: start
        type: choice
        options: [start, stop]

concurrency:
  group: staging-env
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/h2oflows-app/api:staging

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.d.outputs.mode }}
    steps:
      - id: d
        run: |
          mode=none
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ github.event.inputs.action }}"
          elif [ "${{ github.event.action }}" = "labeled" ] && [ "${{ github.event.label.name }}" = "staging" ]; then
            mode=start
          elif [ "${{ github.event.action }}" = "synchronize" ] && ${{ contains(github.event.pull_request.labels.*.name, 'staging') }}; then
            mode=start
          elif [ "${{ github.event.action }}" = "unlabeled" ] && [ "${{ github.event.label.name }}" = "staging" ]; then
            mode=stop
          elif [ "${{ github.event.action }}" = "closed" ] && ${{ contains(github.event.pull_request.labels.*.name, 'staging') }}; then
            mode=stop
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "resolved mode: $mode"

  build-and-up:
    needs: decide
    if: needs.decide.outputs.mode == 'start'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
      - name: SSH — pull image and bring staging up
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /home/ubuntu/h2oflows
            docker compose -f docker-compose.staging.yml pull api-stg
            docker compose -f docker-compose.staging.yml up -d

  down:
    needs: decide
    if: needs.decide.outputs.mode == 'stop'
    runs-on: ubuntu-latest
    steps:
      - name: SSH — bring staging down (keep DB volume)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /home/ubuntu/h2oflows
            docker compose -f docker-compose.staging.yml down
